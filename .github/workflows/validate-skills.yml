name: validate-skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验技能包
        run: python3 scripts/validate.py
      - name: 运行离线测试
        run: python3 -m unittest discover -s tests -v
      - name: 编译 Python 脚本
        run: python3 -m py_compile scripts/validate.py plugins/click/common/scripts/click_api.py plugins/click/common/scripts/check_version.py
